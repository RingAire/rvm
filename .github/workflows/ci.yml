name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: macos-latest,  platform: macos }
          - { os: windows-2025,  platform: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pinned LLVM-MinGW
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          bash scripts/llvm-mingw.sh
          echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        run: make CONFIG=Release EXTRA_CFLAGS=-Werror
      - name: distribution contract tests
        shell: bash
        run: make test
