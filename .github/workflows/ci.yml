name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        shell: bash
        run: make CONFIG=Release
      - name: distribution contract tests
        shell: bash
        run: make test
