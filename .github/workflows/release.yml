name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build / ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    platform: linux,   arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux,   arch: arm64 }
          - { os: macos-13,         platform: macos,   arch: x64 }
          - { os: macos-14,         platform: macos,   arch: arm64 }
          - { os: windows-2025,     platform: windows, arch: x64,   cc: x86_64-w64-mingw32-clang }
          - { os: windows-2025,     platform: windows, arch: x86,   cc: i686-w64-mingw32-clang }
          - { os: windows-2025,     platform: windows, arch: arm64, cc: aarch64-w64-mingw32-clang }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pinned LLVM-MinGW
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          bash scripts/llvm-mingw.sh
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
      - name: build
        shell: bash
        run: make CONFIG=Release RV_VERSION="${GITHUB_REF_NAME#v}" EXTRA_CFLAGS=-Werror
      - name: tests
        if: matrix.platform != 'windows' || matrix.arch == 'x64'
        shell: bash
        run: make test
      - name: verify embedded version
        if: matrix.platform != 'windows' || matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [ "${{ matrix.platform }}" = "windows" ] && exe=".exe"
          ./target/Release/rvm${exe} version | grep -F "${GITHUB_REF_NAME#v}"
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="rvm-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          exe=""
          [ "${{ matrix.platform }}" = "windows" ] && exe=".exe"
          mkdir -p "dist/${name}/bin"
          cp "target/Release/rvm${exe}" "dist/${name}/bin/rvm${exe}"
          cp README.md README.zh.md MIGRATION.md LICENSE NOTICE "dist/${name}/"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            export PKG_NAME="${name}"
            python - <<'PY'
import os, zipfile
from pathlib import Path
name = os.environ["PKG_NAME"]
dist = Path("dist")
with zipfile.ZipFile(dist / f"{name}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
    for path in sorted((dist / name).rglob("*")):
        if path.is_file():
            archive.write(path, path.relative_to(dist).as_posix())
PY
          else
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          fi
          rm -rf "dist/${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: rvm-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "rvm ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
